<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六级单词本</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;color:#171717}h1{font-size:22px;margin:0}.search{position:sticky;top:0;background:#f5f5f2;padding:8px 0 12px;z-index:2}input{width:100%;border:0;outline:0;background:#fff;border-radius:15px;padding:14px 16px;font-size:16px;box-shadow:0 4px 16px #00000008}.count{color:#777;font-size:13px;margin:4px 2px 12px}.letter{font-size:13px;font-weight:700;color:#777;margin:18px 4px 7px}.row{background:#fff;padding:14px 16px;border-bottom:1px solid #eee}.row.first{border-radius:15px 15px 0 0}.row.last{border-radius:0 0 15px 15px;border-bottom:0}.word{font:700 19px Georgia,serif}.meaning{font-size:14px;line-height:1.55;color:#555;margin-top:4px}.empty{text-align:center;color:#888;padding:50px 0}</style></head><body><div class="app"><div class="top"><a class="back" href="./">← 返回</a><h1>单词本</h1></div><div class="search"><input id="q" placeholder="搜索英文单词或中文含义…" autocomplete="off"></div><div class="count" id="count"></div><div id="list"></div></div><script src="vocab.js"></script><script>const V=B.map(x=>[x[0],x[1]]).sort((a,b)=>a[0].localeCompare(b[0]));function render(){let s=q.value.trim().toLowerCase(),a=V.filter(x=>x[0].toLowerCase().includes(s)||x[1].includes(s));count.textContent=`${a.length} / ${V.length} 个单词`;if(!a.length){list.innerHTML='<div class="empty">没有找到匹配的单词</div>';return}let groups={};a.forEach(x=>(groups[x[0][0].toUpperCase()]??=[]).push(x));list.innerHTML=Object.entries(groups).map(([k,g])=>`<div class="letter">${k}</div>${g.map((x,i)=>`<div class="row ${i===0?'first':''} ${i===g.length-1?'last':''}"><div class="word">${x[0]}</div><div class="meaning">${x[1]}</div></div>`).join('')}`).join('')}q.oninput=render;render();</script></body></html>
