<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六级单词本</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 60px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{border:0;background:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;color:#171717}h1{font-size:22px;margin:0}.search{position:sticky;top:0;background:#f5f5f2;padding:8px 0 12px;z-index:2}input{width:100%;border:0;outline:0;background:#fff;border-radius:15px;padding:14px 16px;font-size:16px;box-shadow:0 4px 16px #00000008}.count{color:#777;font-size:13px;margin:4px 2px 12px}.letter{font-size:13px;font-weight:700;color:#777;margin:18px 4px 7px}.row{background:#fff;padding:14px 16px;border-bottom:1px solid #eee}.row.first{border-radius:15px 15px 0 0}.row.last{border-radius:0 0 15px 15px;border-bottom:0}.word{font:700 19px Georgia,serif}.meaning{font-size:14px;line-height:1.55;color:#555;margin-top:4px}.empty{text-align:center;color:#888;padding:50px 0}</style></head><body><div class="app"><div class="top"><a class="back" href="./">← 返回</a><h1>单词本</h1></div><div class="search"><input id="q" placeholder="搜索英文单词或中文含义…" autocomplete="off"></div><div class="count" id="count"></div><div id="list"></div></div><script>const V=[['assert','v. 断言；声称；坚持认为'],['paradox','n. 悖论；看似矛盾的现象'],['hostility','n. 敌意；敌对；反对'],['alleviation','n. 缓解；减轻'],['poverty','n. 贫困；贫穷'],['debate','n. 争论；辩论；v. 辩论；讨论'],['tribe','n. 部落；族群'],['dwelling','n. 住所；住宅'],['livestock','n. 牲畜；家畜'],['havoc','n. 大破坏；严重混乱'],['emancipate','v. 解放；使摆脱束缚'],['sphere','n. 领域；范围；球体'],['apt','adj. 恰当的；易于……的；有……倾向的'],['misconception','n. 误解；错误观念'],['refer','v. 提到；谈及；参考'],['weave','v. 编织；交织；使融入'],['enduring','adj. 持久的；长期存在的'],['presume','v. 假定；推定；想当然地认为'],['misinterpretation','n. 误解；错误解释'],['irresistible','adj. 无法抗拒的；极具吸引力的'],['enormous','adj. 巨大的；庞大的'],['grain of salt','phr. 怀疑态度；保留态度'],['hypothesis','n. 假设；假说'],['appraisal','n. 评价；评估；鉴定'],['embed','v. 使嵌入；使深植'],['desolation','n. 荒凉；荒芜；孤寂'],['ordinary','adj. 普通的；平常的；一般的'],['interval','n. 间隔；间歇'],['symmetry','n. 对称；匀称'],['enthusiastic','adj. 热情的；热心的'],['endorse','v. 支持；赞同；认可'],['horizon','n. 地平线；眼界；范围'],['intermittent','adj. 间歇的；断断续续的'],['scatter','v. 分散；散布；散射'],['status','n. 地位；身份；状况；状态'],['scale','n. 规模；范围；等级'],['acclaim','n./v. 称赞；赞誉'],['tranquil','adj. 宁静的；平静的'],['excessive','adj. 过度的；过多的'],['affluent','adj. 富裕的；富足的'],['irresponsible','adj. 不负责任的'],['hollowed-out','adj. 被掏空的；衰败的'],['conservatism','n. 保守主义；保守倾向'],['radiance','n. 光辉；光彩；容光焕发'],['scarce','adj. 缺乏的；稀少的；不足的'],['align','v. 使对齐；使一致'],['inevitable','adj. 不可避免的；必然发生的'],['resemblance','n. 相似；相像'],['warrant','v. 证明……合理；使有必要'],['deplorable','adj. 糟糕的；令人遗憾的；应受谴责的'],['detached','adj. 分离的；独立的；冷静客观的'],['eclipse','n. 日食；月食；v. 使黯然失色；超过'],['evaluate','v. 评估；评价；估计'],['extreme','adj. 极端的；极度的'],['tribal','adj. 部落的；部族的'],['populist','n. 民粹主义者；adj. 民粹主义的']].sort((a,b)=>a[0].localeCompare(b[0]));function render(){let s=q.value.trim().toLowerCase(),a=V.filter(x=>x[0].toLowerCase().includes(s)||x[1].includes(s));count.textContent=`${a.length} / ${V.length} 个单词`;if(!a.length){list.innerHTML='<div class="empty">没有找到匹配的单词</div>';return}let groups={};a.forEach(x=>(groups[x[0][0].toUpperCase()]??=[]).push(x));list.innerHTML=Object.entries(groups).map(([k,g])=>`<div class="letter">${k}</div>${g.map((x,i)=>`<div class="row ${i===0?'first':''} ${i===g.length-1?'last':''}"><div class="word">${x[0]}</div><div class="meaning">${x[1]}</div></div>`).join('')}`).join('')}q.oninput=render;render();</script></body></html>
