<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六级核心词汇</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 70px}h1{font-size:22px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:15px}.nav button,.nav a,.actions button{border:0;border-radius:12px;padding:11px 3px;background:#fff;font-size:13px;text-decoration:none;color:#222;text-align:center}.nav .active,.primary{background:#222!important;color:#fff!important}.meta{display:flex;justify-content:space-between;color:#888;font-size:13px;margin:8px 3px}.card{background:#fff;border-radius:22px;min-height:390px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 30px #0000000d}.word{font:700 34px Georgia,serif}.ipa{font:16px Georgia,serif;color:#777;margin-top:8px}.meaning{font-size:20px;line-height:1.6;margin-top:18px}.example{font:17px/1.55 Georgia,serif;margin-top:22px}.zh{color:#666;margin-top:7px;line-height:1.6}.root{font-size:14px;color:#555;background:#f5f5f2;border-radius:11px;padding:10px 12px;margin-top:17px;line-height:1.6}.hint{font-size:13px;color:#999;margin-top:25px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions .single{grid-column:1/-1}.search{width:100%;padding:14px;border:0;border-radius:14px;font-size:15px;margin-bottom:10px}.bookitem{background:#fff;border-radius:14px;padding:14px 16px;margin:8px 0}.bookword{font:700 19px Georgia,serif}.bookipa{font:14px Georgia,serif;color:#888;margin-top:4px}.bookmeaning{color:#555;margin-top:5px;line-height:1.5}.tag{font-size:11px;background:#f3e8e8;color:#a33;padding:3px 7px;border-radius:99px;margin-left:7px}.empty{background:#fff;border-radius:20px;padding:35px 20px;text-align:center;line-height:1.8}</style></head><body><div class="app"><h1>六级核心词汇</h1><div class="nav"><button id="tbrowse">刷词</button><button id="tchallenge">挑战</button><button id="treview">复习</button><button id="twordbook">单词本</button><a href="daily.html">每日新闻</a></div><div id="stage"></div></div><script src="vocab.js"></script><script>
const KEY='cet6-v2',NEWS='cet6-news-words',BROWSE='cet6-browse-stats',days=[1,2,4,7,15,30,60];let S={known:{},review:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};S.known=S.known||{};S.review=S.review||{};if(S.known['bewildered']&&!S.known['bewilder'])S.known['bewilder']=true;if(S.review['bewildered']&&!S.review['bewilder'])S.review['bewilder']=S.review['bewildered'];let BS={};try{BS=JSON.parse(localStorage.getItem(BROWSE)||'{}')}catch(e){};function A(){let m=new Map(B.map(x=>[x[0].toLowerCase(),x]));try{Object.values(JSON.parse(localStorage.getItem(NEWS)||'{}')).forEach(n=>m.set(n.word.toLowerCase(),[n.word,n.meaning,n.example||'This word appeared in today’s news reading.',n.translation||'这个词出现在今日新闻阅读中。',n.root||'',true]))}catch(e){}return [...m.values()]}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function saveBS(){localStorage.setItem(BROWSE,JSON.stringify(BS))}function known(w){return !!S.known[w]}function due(w){let r=S.review[w];return known(w)&&(!r||r.due<=Date.now())}function mix(a){return [...a].sort(()=>Math.random()-.5)}function weightedBrowse(a){let pool=[...a],out=[],now=Date.now();while(pool.length){let weights=pool.map(x=>{let s=BS[x[0]]||{count:0,last:0};let novelty=s.count===0?5:1/Math.sqrt(s.count+1);let hours=(now-(s.last||0))/3600000;let recency=s.last&&hours<24?Math.max(.04,hours/24):1;return novelty*recency+.02});let total=weights.reduce((p,c)=>p+c,0),r=Math.random()*total,k=0;for(;k<pool.length-1;k++){r-=weights[k];if(r<=0)break}out.push(pool.splice(k,1)[0])}return out}function markBrowsed(w){let s=BS[w]||{count:0,last:0};s.count=(s.count||0)+1;s.last=Date.now();BS[w]=s;saveBS()}function ipa(w){return IPA[w.toLowerCase()]||''}function ipaline(w,cls='ipa'){let p=ipa(w);return p?'<div class="'+cls+'">'+p+'</div>':''}function detail(x){return '<div class="meaning">'+x[1]+'</div><div class="example">'+x[2]+'</div><div class="zh">'+x[3]+'</div>'+(x[4]?'<div class="root">词根词缀：'+x[4]+'</div>':'')}let mode='browse',list=[],idx=0,reveal=false;const stage=document.getElementById('stage');function activate(m){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('t'+m).classList.add('active')}function setMode(m){mode=m;idx=0;reveal=false;activate(m);let a=A();if(m==='wordbook'){book('');return}if(m==='browse')list=weightedBrowse(a.filter(x=>!known(x[0])));if(m==='challenge')list=mix(a.filter(x=>!known(x[0])));if(m==='review')list=mix(a.filter(x=>due(x[0])));render()}function book(q){let a=A().sort((x,y)=>x[0].localeCompare(y[0]));q=(q||'').toLowerCase();if(q)a=a.filter(x=>x[0].toLowerCase().includes(q)||x[1].includes(q));stage.innerHTML='<input id="search" class="search" placeholder="搜索英文单词或中文含义…"><div style="color:#888;font-size:13px">'+a.length+' 个单词 · A–Z</div>'+a.map(x=>'<div class="bookitem"><div class="bookword">'+x[0]+(x[5]?'<span class="tag">新闻收藏</span>':'')+'</div>'+ipaline(x[0],'bookipa')+'<div class="bookmeaning">'+x[1]+'</div></div>').join('');let s=document.getElementById('search');s.value=q;s.oninput=()=>book(s.value)}function render(){if(!list.length){stage.innerHTML='<div class="empty">'+(mode==='review'?'今天暂无到期复习任务。':'当前没有待学习单词。')+'</div>';return}if(idx>=list.length)idx=0;let x=list[idx],head='<div class="meta"><span>'+(mode==='browse'?'刷词 · 智能随机':mode==='challenge'?'挑战':'复习')+'</span><span>'+(idx+1)+' / '+list.length+'</span></div>';let word='<div class="word">'+x[0]+'</div>'+ipaline(x[0]);if(mode==='browse'){stage.innerHTML=head+'<div class="card">'+word+detail(x)+'</div><div class="actions"><button id="prev">← 上一词</button><button id="next" class="primary">下一词 →</button></div>';document.getElementById('prev').onclick=()=>{idx=(idx-1+list.length)%list.length;render()};document.getElementById('next').onclick=()=>{markBrowsed(x[0]);idx=(idx+1)%list.length;render()};return}if(mode==='challenge'&&reveal){stage.innerHTML=head+'<div class="card">'+word+detail(x)+'</div><div class="actions"><button id="onlynext" class="primary single">下一个 →</button></div>';document.getElementById('onlynext').onclick=()=>{reveal=false;idx=(idx+1)%list.length;render()};return}stage.innerHTML=head+'<div class="card">'+word+(reveal?detail(x):'<div class="hint">'+(mode==='review'?'先回忆释义，再作答':'你认识这个词吗？')+'</div>')+'</div><div class="actions"><button id="no">不认识</button><button id="yes" class="primary">认识 ✓</button></div>';document.getElementById('no').onclick=()=>judge(false);document.getElementById('yes').onclick=()=>judge(true)}function judge(g){let w=list[idx][0];if(mode==='challenge'){if(!g){reveal=true;render();return}S.known[w]=true;S.review[w]={level:0,due:Date.now()+86400000};save();list.splice(idx,1);reveal=false;render();return}let r=S.review[w]||{level:0};r.level=g?Math.min((r.level||0)+1,days.length-1):0;r.due=Date.now()+days[r.level]*86400000;S.review[w]=r;save();list.splice(idx,1);reveal=false;render()}['browse','challenge','review','wordbook'].forEach(m=>document.getElementById('t'+m).onclick=()=>setMode(m));setMode('browse');
</script></body></html>
