<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六级核心词汇</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f5f5f2;margin:0;color:#171717}.app{max-width:680px;margin:auto;padding:20px 16px}h1{font-size:22px}.card{background:#fff;border-radius:22px;padding:34px 24px;min-height:330px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:0 8px 30px #0000000d}.word{font:700 34px Georgia}.meaning{font-size:20px;line-height:1.6;margin-top:22px}.example{font:17px/1.55 Georgia;margin-top:24px}.zh{color:#777;margin-top:8px}.hide{display:none}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}button{border:0;border-radius:12px;padding:12px;background:#fff}.primary{background:#222;color:#fff}.top{display:flex;justify-content:space-between;align-items:center}.bar{height:5px;background:#ddd;border-radius:9px;margin:14px 0;overflow:hidden}.fill{height:100%;background:#222}</style></head><body><div class="app"><div class="top"><h1>六级核心词汇</h1><button onclick="shuffle()">重新乱序</button></div><div class="bar"><div class="fill" id="fill"></div></div><div class="card" id="card" onclick="reveal()"><div class="word" id="w"></div><div id="ans" class="hide"><div class="meaning" id="m"></div><div class="example" id="e"></div><div class="zh" id="z"></div></div><small id="hint">点击卡片显示释义与例句</small></div><div class="actions"><button onclick="next(false)">不认识</button><button onclick="prev()">上一个</button><button class="primary" onclick="next(true)">认识 ✓</button></div><p id="count" style="text-align:center;color:#777"></p></div><script>const V=[['assert','v. 断言；声称；坚持认为','The author asserts that the current system needs reform.','作者断言现行制度需要改革。'],['paradox','n. 悖论；看似矛盾的现象','It is a paradox that technology can connect people yet make them feel lonely.','科技既能连接人们又可能让人感到孤独，这是一个悖论。'],['hostility','n. 敌意；敌对；反对','The proposal was met with hostility from some residents.','这项提议遭到了一些居民的强烈反对。'],['alleviation','n. 缓解；减轻','The policy aims at the alleviation of rural poverty.','这项政策旨在缓解农村贫困。'],['poverty','n. 贫困；贫穷','Education can help families escape poverty.','教育能够帮助家庭摆脱贫困。'],['debate','n. 争论；辩论；v. 辩论；讨论','Scientists continue to debate the causes of the phenomenon.','科学家们仍在讨论这一现象的成因。'],['tribe','n. 部落；族群','The tribe has preserved its language for generations.','这个部落世代保留着自己的语言。'],['dwelling','n. 住所；住宅','The old dwelling has been converted into a small museum.','这座旧住宅已经被改造成一座小型博物馆。'],['livestock','n. 牲畜；家畜','The farmers raise livestock for food and income.','农民饲养牲畜以获取食物和收入。'],['havoc','n. 大破坏；严重混乱','The storm caused havoc across the coastal area.','暴风雨给沿海地区造成了严重破坏。'],['emancipate','v. 解放；使摆脱束缚','Education can emancipate people from ignorance and prejudice.','教育可以使人摆脱无知和偏见的束缚。'],['sphere','n. 领域；范围；球体','Technology has changed almost every sphere of modern life.','科技已经改变了现代生活的几乎每个领域。'],['apt','adj. 恰当的；易于……的；有……倾向的','Young children are apt to imitate the adults around them.','年幼的孩子往往会模仿身边的成年人。'],['misconception','n. 误解；错误观念','It is a common misconception that success depends only on talent.','认为成功只取决于天赋是一种常见的错误观念。'],['refer','v. 提到；谈及；参考','The report refers to several recent studies.','这份报告提到了几项近期研究。'],['weave','v. 编织；交织；使融入','The writer weaves historical facts into the story.','作者把历史事实融入故事之中。'],['enduring','adj. 持久的；长期存在的','Their research has had an enduring influence on the field.','他们的研究对该领域产生了持久影响。'],['presume','v. 假定；推定；想当然地认为','We should not presume that higher prices always mean better quality.','我们不应想当然地认为价格越高质量就一定越好。'],['misinterpretation','n. 误解；错误解释','A misinterpretation of the data led to the wrong conclusion.','对数据的错误解读导致了错误的结论。'],['irresistible','adj. 无法抗拒的；极具吸引力的','The idea of getting quick results can be irresistible.','迅速取得成果的想法可能极具诱惑力。'],['enormous','adj. 巨大的；庞大的','The project requires an enormous amount of time and money.','这个项目需要大量的时间和金钱。'],['grain of salt','phr. 怀疑态度；保留态度','You should take online rumors with a grain of salt.','你应该对网上的传言持保留态度，不要全信。'],['hypothesis','n. 假设；假说','The researchers tested the hypothesis with new data.','研究人员用新数据检验了这一假设。'],['appraisal','n. 评价；评估；鉴定','The report provides an appraisal of the project’s risks.','这份报告对该项目的风险进行了评估。'],['embed','v. 使嵌入；使深植','These values are deeply embedded in the culture.','这些价值观深深植根于这种文化之中。'],['desolation','n. 荒凉；荒芜；孤寂','The abandoned village was a scene of desolation.','这座废弃的村庄呈现出一片荒凉景象。'],['ordinary','adj. 普通的；平常的；一般的','Even ordinary people can make a meaningful difference.','即使普通人也能带来有意义的改变。'],['interval','n. 间隔；间歇','There was a short interval between the two lectures.','两场讲座之间有一小段间隔。'],['symmetry','n. 对称；匀称','The design is admired for its perfect symmetry.','这个设计因其完美的对称性而受到赞赏。'],['enthusiastic','adj. 热情的；热心的','Students were enthusiastic about the new course.','学生们对这门新课程非常热情。'],['endorse','v. 支持；赞同；认可','Many experts endorse the proposal to improve public transport.','许多专家支持改善公共交通的提议。'],['horizon','n. 地平线；眼界；范围','Studying abroad can broaden your horizons.','出国学习可以开阔你的眼界。'],['intermittent','adj. 间歇的；断断续续的','Intermittent rain continued throughout the afternoon.','整个下午都断断续续地下着雨。'],['scatter','v. 分散；散布；散射','The wind scattered the leaves across the road.','风把树叶吹散到了道路各处。'],['status','n. 地位；身份；状况；状态','Education can influence a person’s social status.','教育可能影响一个人的社会地位。'],['scale','n. 规模；范围；等级','The problem exists on a global scale.','这个问题在全球范围内存在。'],['acclaim','n./v. 称赞；赞誉','The novel received widespread acclaim from critics.','这部小说获得了评论界的广泛赞誉。'],['tranquil','adj. 宁静的；平静的','The lake was tranquil in the early morning.','清晨的湖面十分宁静。'],['excessive','adj. 过度的；过多的','Excessive use of smartphones may affect sleep quality.','过度使用智能手机可能影响睡眠质量。'],['affluent','adj. 富裕的；富足的','The service is mainly used by affluent consumers.','这项服务主要由富裕消费者使用。'],['irresponsible','adj. 不负责任的','It would be irresponsible to ignore the potential risks.','忽视潜在风险是不负责任的。'],['hollowed-out','adj. 被掏空的；衰败的','Years of population loss left the town hollowed-out.','多年的人口流失使这座小镇逐渐衰败。'],['conservatism','n. 保守主义；保守倾向','Economic uncertainty may encourage greater conservatism in spending.','经济不确定性可能使人们在消费上更加保守。'],['radiance','n. 光辉；光彩；容光焕发','The morning sun filled the room with radiance.','清晨的阳光使房间充满光辉。'],['scarce','adj. 缺乏的；稀少的；不足的','Clean water is scarce in some regions.','在一些地区，清洁水资源十分稀缺。'],['align','v. 使对齐；使一致','The new policy should align with the university’s long-term goals.','新政策应与大学的长期目标保持一致。'],['inevitable','adj. 不可避免的；必然发生的','Some degree of uncertainty is inevitable in scientific research.','科学研究中一定程度的不确定性是不可避免的。'],['resemblance','n. 相似；相像','There is a strong resemblance between the two theories.','这两种理论之间有很强的相似性。'],['warrant','v. 证明……合理；使有必要','The evidence does not warrant such a strong conclusion.','这些证据不足以证明如此强烈的结论是合理的。'],['deplorable','adj. 糟糕的；令人遗憾的；应受谴责的','The workers were living in deplorable conditions.','这些工人的生活条件十分糟糕。'],['detached','adj. 分离的；独立的；冷静客观的','A researcher should remain detached when evaluating the evidence.','研究人员在评估证据时应保持客观冷静。'],['eclipse','n. 日食；月食；v. 使黯然失色；超过','Her latest achievement eclipsed all her previous successes.','她最新的成就使以往所有成功都黯然失色。'],['evaluate','v. 评估；评价；估计','Students should learn to evaluate information critically.','学生应该学会批判性地评估信息。'],['extreme','adj. 极端的；极度的','The region experienced extreme weather last winter.','这个地区去年冬天经历了极端天气。'],['tribal','adj. 部落的；部族的','Some traditions remain important in tribal communities.','一些传统在部落社区中仍然十分重要。'],['populist','n. 民粹主义者；adj. 民粹主义的','The politician adopted populist language during the campaign.','这名政治人物在竞选期间采用了民粹主义式的言辞。']];let words=[...V],i=0;function shuffle(){words.sort(()=>Math.random()-.5);i=0;render()}function render(){let x=words[i];w.textContent=x[0];m.textContent=x[1];e.textContent=x[2];z.textContent=x[3];ans.className='hide';hint.style.display='block';count.textContent=`${i+1} / ${words.length}`;fill.style.width=((i+1)/words.length*100)+'%'}function reveal(){ans.className='';hint.style.display='none'}function next(k){let s=new Set(JSON.parse(localStorage.getItem('cet6-known')||'[]'));k?s.add(words[i][0]):s.delete(words[i][0]);localStorage.setItem('cet6-known',JSON.stringify([...s]));i=(i+1)%words.length;render()}function prev(){i=(i-1+words.length)%words.length;render()}shuffle()</script></body></html>
