<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六级核心词汇</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 70px}h1{font-size:22px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:15px}.nav button,.nav a,.actions button{border:0;border-radius:12px;padding:11px 3px;background:#fff;font-size:13px;text-decoration:none;color:#222;text-align:center}.nav .active,.primary{background:#222!important;color:#fff!important}.meta{display:flex;justify-content:space-between;color:#888;font-size:13px;margin:8px 3px}.card{background:#fff;border-radius:22px;min-height:390px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 30px #0000000d}.word{font:700 34px Georgia,serif}.meaning{font-size:20px;line-height:1.6;margin-top:20px}.example{font:17px/1.55 Georgia,serif;margin-top:22px}.zh{color:#666;margin-top:7px;line-height:1.6}.root{font-size:14px;color:#555;background:#f5f5f2;border-radius:11px;padding:10px 12px;margin-top:17px;line-height:1.6}.hint{font-size:13px;color:#999;margin-top:25px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.actions .single{grid-column:1/-1}.search{width:100%;padding:14px;border:0;border-radius:14px;font-size:15px;margin-bottom:10px}.bookitem{background:#fff;border-radius:14px;padding:14px 16px;margin:8px 0}.bookword{font:700 19px Georgia,serif}.bookmeaning{color:#555;margin-top:5px;line-height:1.5}.tag{font-size:11px;background:#f3e8e8;color:#a33;padding:3px 7px;border-radius:99px;margin-left:7px}.empty{background:#fff;border-radius:20px;padding:35px 20px;text-align:center;line-height:1.8}</style></head><body><div class="app"><h1>六级核心词汇</h1><div class="nav"><button id="tbrowse">刷词</button><button id="tchallenge">挑战</button><button id="treview">复习</button><button id="twordbook">单词本</button><a href="daily.html">每日新闻</a></div><div id="stage"></div></div><script>
const B=[
['assert','v. 断言；声称；坚持认为','The author asserts that the current system needs reform.','作者断言现行制度需要改革。','as- 加强 + sert“连接/放置” → 断言'],['paradox','n. 悖论；看似矛盾的现象','Technology can create a paradox.','科技可能造成悖论。','para- 反常 + dox 观点'],['hostility','n. 敌意；敌对；反对','The proposal was met with hostility.','这项提议遭到反对。','hostile + -ity'],['alleviation','n. 缓解；减轻','The policy aims at the alleviation of poverty.','政策旨在缓解贫困。','alleviate + -ion'],['poverty','n. 贫困；贫穷','Education can help families escape poverty.','教育能帮助家庭摆脱贫困。','poor 相关词源 + -ty'],['debate','n./v. 争论；辩论；讨论','Scientists continue to debate the issue.','科学家继续讨论这个问题。','de- + bat“打” → 言语交锋'],['tribe','n. 部落；族群','The tribe preserved its language.','这个部落保留了自己的语言。',''],['dwelling','n. 住所；住宅','The old dwelling became a museum.','旧住宅变成了博物馆。','dwell + -ing'],['livestock','n. 牲畜；家畜','Farmers raise livestock.','农民饲养牲畜。','live + stock'],['havoc','n. 大破坏；严重混乱','The storm caused havoc.','暴风雨造成严重破坏。',''],['emancipate','v. 解放；使摆脱束缚','Education can emancipate people from ignorance.','教育能使人摆脱无知。','e-/ex- 出 + mancip 控制 + -ate'],['sphere','n. 领域；范围；球体','Technology affects every sphere of life.','科技影响生活各领域。','spher 球'],['apt','adj. 恰当的；易于……的；有……倾向的','Children are apt to imitate adults.','孩子往往会模仿成年人。',''],['misconception','n. 误解；错误观念','This is a common misconception.','这是一种常见误解。','mis- 错误 + concept + -ion'],['refer','v. 提到；谈及；参考','The report refers to recent studies.','报告提到了近期研究。','re- + fer 带/拿'],['weave','v. 编织；交织；使融入','The writer weaves facts into the story.','作者把事实融入故事。',''],['enduring','adj. 持久的；长期存在的','The research had an enduring influence.','研究产生了持久影响。','endure + -ing'],['presume','v. 假定；推定；想当然地认为','We should not presume that price means quality.','我们不应想当然认为价格代表质量。','pre- 在前 + sume 取'],['misinterpretation','n. 误解；错误解释','A misinterpretation led to the wrong conclusion.','错误解读导致错误结论。','mis- + interpret + -ation'],['irresistible','adj. 无法抗拒的；极具吸引力的','The offer seemed irresistible.','这个提议似乎难以抗拒。','ir- 不 + resist + -ible'],['enormous','adj. 巨大的；庞大的','The project requires enormous resources.','项目需要大量资源。','e-/ex- 超出 + norm 标准 + -ous'],['grain of salt','phr. 怀疑态度；保留态度','Take online rumors with a grain of salt.','对网络传言应持保留态度。',''],['hypothesis','n. 假设；假说','Researchers tested the hypothesis.','研究人员检验了假设。','hypo- + thesis 论题'],['appraisal','n. 评价；评估；鉴定','The report provides an appraisal of the risks.','报告对风险进行了评估。','appraise + -al'],['embed','v. 使嵌入；使深植','These values are embedded in the culture.','这些价值观深植于文化中。','em-/en- 进入 + bed'],['desolation','n. 荒凉；荒芜；孤寂','The village was a scene of desolation.','村庄一片荒凉。','desolate + -ion'],['ordinary','adj. 普通的；平常的；一般的','Ordinary people can make a difference.','普通人也能带来改变。','ordin + -ary'],['interval','n. 间隔；间歇','There was a short interval between lectures.','两场讲座间有短暂间隔。','inter- 之间'],['symmetry','n. 对称；匀称','The design has perfect symmetry.','设计具有完美对称性。','sym-/syn- 相同 + metr 测量'],['enthusiastic','adj. 热情的；热心的','Students were enthusiastic about the course.','学生对课程很热情。','enthusiasm + -astic'],['endorse','v. 支持；赞同；认可','Experts endorse the proposal.','专家支持该提议。','en- + dors 背'],['horizon','n. 地平线；眼界；范围','Travel can broaden your horizons.','旅行能开阔眼界。',''],['intermittent','adj. 间歇的；断断续续的','Intermittent rain continued all afternoon.','整个下午断断续续下雨。','inter- + mit + -ent'],['scatter','v. 分散；散布；散射','The wind scattered the leaves.','风吹散了树叶。',''],['status','n. 地位；身份；状况；状态','Education can influence social status.','教育可能影响社会地位。','stat 状态 + -us'],['scale','n. 规模；范围；等级','The problem exists on a global scale.','问题存在于全球范围。',''],['acclaim','n./v. 称赞；赞誉','The novel received widespread acclaim.','小说获得广泛赞誉。','ac- + claim 呼喊'],['tranquil','adj. 宁静的；平静的','The lake was tranquil in the morning.','清晨湖面很宁静。',''],['excessive','adj. 过度的；过多的','Excessive phone use may affect sleep.','过度使用手机可能影响睡眠。','excess + -ive'],['affluent','adj. 富裕的；富足的','The service targets affluent consumers.','服务面向富裕消费者。','af- + flu 流 + -ent'],['irresponsible','adj. 不负责任的','It is irresponsible to ignore the risks.','忽视风险是不负责任的。','ir- 不 + responsible'],['hollowed-out','adj. 被掏空的；衰败的','Population loss left the town hollowed-out.','人口流失使小镇衰败。','hollow + out'],['conservatism','n. 保守主义；保守倾向','Uncertainty may encourage conservatism in spending.','不确定性可能使消费更保守。','conserve + -ism'],['radiance','n. 光辉；光彩；容光焕发','The sun filled the room with radiance.','阳光使房间充满光辉。','radi 光线 + -ance'],['scarce','adj. 缺乏的；稀少的；不足的','Clean water is scarce in some regions.','一些地区清洁水稀缺。',''],['align','v. 使对齐；使一致','The policy should align with long-term goals.','政策应与长期目标一致。','a-/ad- 向 + line'],['inevitable','adj. 不可避免的；必然发生的','Some uncertainty is inevitable.','一定程度的不确定性不可避免。','in- 不 + evit 避免 + -able'],['resemblance','n. 相似；相像','There is a resemblance between the theories.','两种理论存在相似之处。','resemble + -ance'],['warrant','v. 证明……合理；使有必要','The evidence does not warrant that conclusion.','证据不足以支持该结论。',''],['deplorable','adj. 糟糕的；令人遗憾的；应受谴责的','Workers lived in deplorable conditions.','工人生活条件很糟糕。','deplore + -able'],['detached','adj. 分离的；独立的；冷静客观的','Researchers should remain detached.','研究人员应保持客观。','de- 离开 + attach + -ed'],['eclipse','n. 日食；月食；v. 使黯然失色；超过','Her latest achievement eclipsed earlier successes.','她的新成就使以往成功黯然失色。','ec-/ex- 离开'],['evaluate','v. 评估；评价；估计','Students should evaluate information critically.','学生应批判性评估信息。','valu 价值 + -ate'],['extreme','adj. 极端的；极度的','The region experienced extreme weather.','该地区经历了极端天气。','extr 最外 + -eme'],['tribal','adj. 部落的；部族的','The custom remains important in tribal communities.','该习俗在部落社区仍很重要。','tribe + -al'],['populist','n. 民粹主义者；adj. 民粹主义的','The politician adopted populist language.','该政治人物采用了民粹主义式言辞。','popul 人民 + -ist']];
const KEY='cet6-v2',NEWS='cet6-news-words',days=[1,2,4,7,15,30,60];let S={known:{},review:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){};S.known=S.known||{};S.review=S.review||{};function A(){let m=new Map(B.map(x=>[x[0].toLowerCase(),x]));try{Object.values(JSON.parse(localStorage.getItem(NEWS)||'{}')).forEach(n=>m.set(n.word.toLowerCase(),[n.word,n.meaning,n.example||'This word appeared in today’s news reading.',n.translation||'这个词出现在今日新闻阅读中。',n.root||'',true]))}catch(e){}return [...m.values()]}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function known(w){return !!S.known[w]}function due(w){let r=S.review[w];return known(w)&&(!r||r.due<=Date.now())}function mix(a){return [...a].sort(()=>Math.random()-.5)}function detail(x){return '<div class="meaning">'+x[1]+'</div><div class="example">'+x[2]+'</div><div class="zh">'+x[3]+'</div>'+(x[4]?'<div class="root">词根词缀：'+x[4]+'</div>':'')}let mode='browse',list=[],idx=0,reveal=false;const stage=document.getElementById('stage');function activate(m){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('t'+m).classList.add('active')}function setMode(m){mode=m;idx=0;reveal=false;activate(m);let a=A();if(m==='wordbook'){book('');return}if(m==='browse')list=a.filter(x=>!known(x[0]));if(m==='challenge')list=mix(a.filter(x=>!known(x[0])));if(m==='review')list=mix(a.filter(x=>due(x[0])));render()}function book(q){let a=A().sort((x,y)=>x[0].localeCompare(y[0]));q=(q||'').toLowerCase();if(q)a=a.filter(x=>x[0].toLowerCase().includes(q)||x[1].includes(q));stage.innerHTML='<input id="search" class="search" placeholder="搜索英文单词或中文含义…"><div style="color:#888;font-size:13px">'+a.length+' 个单词 · A–Z</div>'+a.map(x=>'<div class="bookitem"><div class="bookword">'+x[0]+(x[5]?'<span class="tag">新闻收藏</span>':'')+'</div><div class="bookmeaning">'+x[1]+'</div></div>').join('');let s=document.getElementById('search');s.value=q;s.oninput=()=>book(s.value)}function render(){if(!list.length){stage.innerHTML='<div class="empty">'+(mode==='review'?'今天暂无到期复习任务。':'当前没有待学习单词。')+'</div>';return}if(idx>=list.length)idx=0;let x=list[idx],head='<div class="meta"><span>'+(mode==='browse'?'刷词':mode==='challenge'?'挑战':'复习')+'</span><span>'+(idx+1)+' / '+list.length+'</span></div>';if(mode==='browse'){stage.innerHTML=head+'<div class="card"><div class="word">'+x[0]+'</div>'+detail(x)+'</div><div class="actions"><button id="prev">← 上一词</button><button id="next" class="primary">下一词 →</button></div>';document.getElementById('prev').onclick=()=>{idx=(idx-1+list.length)%list.length;render()};document.getElementById('next').onclick=()=>{idx=(idx+1)%list.length;render()};return}if(mode==='challenge'&&reveal){stage.innerHTML=head+'<div class="card"><div class="word">'+x[0]+'</div>'+detail(x)+'</div><div class="actions"><button id="onlynext" class="primary single">下一个 →</button></div>';document.getElementById('onlynext').onclick=()=>{reveal=false;idx=(idx+1)%list.length;render()};return}stage.innerHTML=head+'<div class="card"><div class="word">'+x[0]+'</div>'+(reveal?detail(x):'<div class="hint">'+(mode==='review'?'先回忆释义，再作答':'你认识这个词吗？')+'</div>')+'</div><div class="actions"><button id="no">不认识</button><button id="yes" class="primary">认识 ✓</button></div>';document.getElementById('no').onclick=()=>judge(false);document.getElementById('yes').onclick=()=>judge(true)}function judge(g){let w=list[idx][0];if(mode==='challenge'){if(!g){reveal=true;render();return}S.known[w]=true;S.review[w]={level:0,due:Date.now()+86400000};save();list.splice(idx,1);reveal=false;render();return}let r=S.review[w]||{level:0};r.level=g?Math.min((r.level||0)+1,days.length-1):0;r.due=Date.now()+days[r.level]*86400000;S.review[w]=r;save();list.splice(idx,1);reveal=false;render()}['browse','challenge','review','wordbook'].forEach(m=>document.getElementById('t'+m).onclick=()=>setMode(m));setMode('browse');
</script></body></html>
