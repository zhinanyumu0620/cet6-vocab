<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六级核心词汇</title><style>:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 70px}h1{font-size:22px;margin:5px 0 16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:15px}.tabs button,.actions button{border:0;border-radius:13px;padding:12px 5px;background:#fff;font-size:14px}.tabs .active,.actions .primary{background:#222;color:#fff}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:8px 3px}.card{background:#fff;border-radius:22px;min-height:390px;padding:30px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 30px #0000000d}.word{font:700 34px/1.2 Georgia,serif;word-break:break-word}.meaning{font-size:20px;line-height:1.6;margin-top:20px}.example{font:17px/1.55 Georgia,serif;margin-top:23px}.zh{font-size:15px;line-height:1.6;color:#666;margin-top:7px}.root{font-size:14px;line-height:1.6;color:#555;margin-top:18px;padding:10px 12px;background:#f5f5f2;border-radius:11px}.hint{font-size:13px;color:#999;margin-top:25px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.empty{background:#fff;border-radius:20px;padding:38px 24px;text-align:center;line-height:1.8}.reset{margin-top:22px;border:0;background:none;color:#999;text-decoration:underline}.search{width:100%;padding:14px 16px;border:0;outline:none;border-radius:15px;background:#fff;font-size:16px;margin:2px 0 12px}.bookcount{font-size:13px;color:#888;margin:0 3px 10px}.bookitem{background:#fff;border-radius:15px;padding:15px 17px;margin:8px 0}.bookword{font:700 19px Georgia,serif;margin-bottom:5px}.bookmeaning{font-size:14px;line-height:1.55;color:#555}</style></head><body><div class="app"><h1>六级核心词汇</h1><div class="tabs"><button id="tbrowse" onclick="setMode('browse')">刷词</button><button id="tchallenge" onclick="setMode('challenge')">挑战</button><button id="treview" onclick="setMode('review')">复习</button><button id="twordbook" onclick="setMode('wordbook')">单词本</button></div><div id="stage"></div></div><script>
const V=[
['assert','v. 断言；声称；坚持认为','The author asserts that the current system needs reform.','作者断言现行制度需要改革。','as- 加强 + sert“连接/放置” → 坚定地说出 → 断言'],['paradox','n. 悖论；看似矛盾的现象','It is a paradox that technology can connect people yet make them feel lonely.','科技既能连接人们又可能让人感到孤独，这是一个悖论。','para-“反常/旁” + dox“观点” → 反常的观点'],['hostility','n. 敌意；敌对；反对','The proposal was met with hostility from some residents.','这项提议遭到了一些居民的强烈反对。','hostile 敌对的 + -ity 名词后缀'],['alleviation','n. 缓解；减轻','The policy aims at the alleviation of rural poverty.','这项政策旨在缓解农村贫困。','alleviate 缓解 + -ion 名词后缀'],['poverty','n. 贫困；贫穷','Education can help families escape poverty.','教育能够帮助家庭摆脱贫困。','poor“贫穷”相关词源 + -ty 名词后缀'],['debate','n. 争论；辩论；v. 辩论；讨论','Scientists continue to debate the causes of the phenomenon.','科学家们仍在讨论这一现象的成因。','de- 加强 + bat“打” → 言语交锋 → 辩论'],['tribe','n. 部落；族群','The tribe has preserved its language for generations.','这个部落世代保留着自己的语言。',''],['dwelling','n. 住所；住宅','The old dwelling has been converted into a small museum.','这座旧住宅已经被改造成一座小型博物馆。','dwell 居住 + -ing 名词后缀'],['livestock','n. 牲畜；家畜','The farmers raise livestock for food and income.','农民饲养牲畜以获取食物和收入。','live 活的 + stock 牲畜/存栏 → 家畜'],['havoc','n. 大破坏；严重混乱','The storm caused havoc across the coastal area.','暴风雨给沿海地区造成了严重破坏。',''],['emancipate','v. 解放；使摆脱束缚','Education can emancipate people from ignorance and prejudice.','教育可以使人摆脱无知和偏见的束缚。','e-/ex-“出” + mancip“控制/占有” + -ate → 从控制中放出'],['sphere','n. 领域；范围；球体','Technology has changed almost every sphere of modern life.','科技已经改变了现代生活的几乎每个领域。','spher“球” → 球体；引申为范围/领域'],['apt','adj. 恰当的；易于……的；有……倾向的','Young children are apt to imitate the adults around them.','年幼的孩子往往会模仿身边的成年人。',''],['misconception','n. 误解；错误观念','It is a common misconception that success depends only on talent.','认为成功只取决于天赋是一种常见的错误观念。','mis-“错误” + concept“观念” + -ion → 错误观念'],['refer','v. 提到；谈及；参考','The report refers to several recent studies.','这份报告提到了几项近期研究。','re-“回” + fer“带/拿” → 带回某事 → 提及/参考'],['weave','v. 编织；交织；使融入','The writer weaves historical facts into the story.','作者把历史事实融入故事之中。',''],['enduring','adj. 持久的；长期存在的','Their research has had an enduring influence on the field.','他们的研究对该领域产生了持久影响。','endure 持续/忍耐 + -ing 形容词后缀'],['presume','v. 假定；推定；想当然地认为','We should not presume that higher prices always mean better quality.','我们不应想当然地认为价格越高质量就一定越好。','pre-“在前” + sume“取” → 事先取定 → 假定'],['misinterpretation','n. 误解；错误解释','A misinterpretation of the data led to the wrong conclusion.','对数据的错误解读导致了错误的结论。','mis-“错误” + interpret“解释” + -ation → 错误解释'],['irresistible','adj. 无法抗拒的；极具吸引力的','The idea of getting quick results can be irresistible.','迅速取得成果的想法可能极具诱惑力。','ir-（in-）“不” + resist“抵抗” + -ible“能…的” → 无法抗拒的'],['enormous','adj. 巨大的；庞大的','The project requires an enormous amount of time and money.','这个项目需要大量的时间和金钱。','e-/ex-“超出” + norm“标准” + -ous → 超出常规的 → 巨大的'],['grain of salt','phr. 怀疑态度；保留态度','You should take online rumors with a grain of salt.','你应该对网上的传言持保留态度，不要全信。','固定短语，无需拆词根词缀'],['hypothesis','n. 假设；假说','The researchers tested the hypothesis with new data.','研究人员用新数据检验了这一假设。','hypo-“在下/不足” + thesis“放置/论题” → 暂时放下的命题 → 假设'],['appraisal','n. 评价；评估；鉴定','The report provides an appraisal of the project’s risks.','这份报告对该项目的风险进行了评估。','appraise 评价 + -al 名词后缀'],['embed','v. 使嵌入；使深植','These values are deeply embedded in the culture.','这些价值观深深植根于这种文化之中。','em-/en-“使进入” + bed“床/基底” → 嵌入'],['desolation','n. 荒凉；荒芜；孤寂','The abandoned village was a scene of desolation.','这座废弃的村庄呈现出一片荒凉景象。','desolate 荒凉的 + -ion 名词后缀'],['ordinary','adj. 普通的；平常的；一般的','Even ordinary people can make a meaningful difference.','即使普通人也能带来有意义的改变。','ordin“秩序/次序” + -ary 形容词后缀 → 按常规次序的 → 普通的'],['interval','n. 间隔；间歇','There was a short interval between the two lectures.','两场讲座之间有一小段间隔。','inter-“在…之间” + val“间隔” → 间隔'],['symmetry','n. 对称；匀称','The design is admired for its perfect symmetry.','这个设计因其完美的对称性而受到赞赏。','sym-/syn-“共同/相同” + metr“测量” + -y → 两边同量 → 对称'],['enthusiastic','adj. 热情的；热心的','Students were enthusiastic about the new course.','学生们对这门新课程非常热情。','enthusiasm 热情 + -astic 形容词后缀'],['endorse','v. 支持；赞同；认可','Many experts endorse the proposal to improve public transport.','许多专家支持改善公共交通的提议。','en-“在…上” + dors“背” → 原指在背面签名 → 背书/支持'],['horizon','n. 地平线；眼界；范围','Studying abroad can broaden your horizons.','出国学习可以开阔你的眼界。',''],['intermittent','adj. 间歇的；断断续续的','Intermittent rain continued throughout the afternoon.','整个下午都断断续续地下着雨。','inter-“在…之间” + mit“送/放” + -ent → 中间停放 → 间歇的'],['scatter','v. 分散；散布；散射','The wind scattered the leaves across the road.','风把树叶吹散到了道路各处。',''],['status','n. 地位；身份；状况；状态','Education can influence a person’s social status.','教育可能影响一个人的社会地位。','stat“站立/状态” + -us → 所处状态'],['scale','n. 规模；范围；等级','The problem exists on a global scale.','这个问题在全球范围内存在。',''],['acclaim','n./v. 称赞；赞誉','The novel received widespread acclaim from critics.','这部小说获得了评论界的广泛赞誉。','ac-（ad-）“向” + claim“呼喊” → 向…欢呼 → 称赞'],['tranquil','adj. 宁静的；平静的','The lake was tranquil in the early morning.','清晨的湖面十分宁静。',''],['excessive','adj. 过度的；过多的','Excessive use of smartphones may affect sleep quality.','过度使用智能手机可能影响睡眠质量。','excess 过量 + -ive 形容词后缀'],['affluent','adj. 富裕的；富足的','The service is mainly used by affluent consumers.','这项服务主要由富裕消费者使用。','af-（ad-）“向” + flu“流” + -ent → 财富流入的 → 富裕的'],['irresponsible','adj. 不负责任的','It would be irresponsible to ignore the potential risks.','忽视潜在风险是不负责任的。','ir-（in-）“不” + responsible“负责的” → 不负责任的'],['hollowed-out','adj. 被掏空的；衰败的','Years of population loss left the town hollowed-out.','多年的人口流失使这座小镇逐渐衰败。','hollow“空的” + out“向外/完全” → 掏空的'],['conservatism','n. 保守主义；保守倾向','Economic uncertainty may encourage greater conservatism in spending.','经济不确定性可能使人们在消费上更加保守。','conserve 保持/保存 + -atism/-ism 主义/倾向'],['radiance','n. 光辉；光彩；容光焕发','The morning sun filled the room with radiance.','清晨的阳光使房间充满光辉。','radi“光线” + -ance 名词后缀 → 光辉'],['scarce','adj. 缺乏的；稀少的；不足的','Clean water is scarce in some regions.','在一些地区，清洁水资源十分稀缺。',''],['align','v. 使对齐；使一致','The new policy should align with the university’s long-term goals.','新政策应与大学的长期目标保持一致。','a-/ad-“向” + line“线” → 排成一线 → 对齐/一致'],['inevitable','adj. 不可避免的；必然发生的','Some degree of uncertainty is inevitable in scientific research.','科学研究中一定程度的不确定性是不可避免的。','in-“不” + evit“避免” + -able“可…的” → 不可避免的'],['resemblance','n. 相似；相像','There is a strong resemblance between the two theories.','这两种理论之间有很强的相似性。','resemble 相似 + -ance 名词后缀'],['warrant','v. 证明……合理；使有必要','The evidence does not warrant such a strong conclusion.','这些证据不足以证明如此强烈的结论是合理的。',''],['deplorable','adj. 糟糕的；令人遗憾的；应受谴责的','The workers were living in deplorable conditions.','这些工人的生活条件十分糟糕。','deplore 谴责/哀叹 + -able 形容词后缀'],['detached','adj. 分离的；独立的；冷静客观的','A researcher should remain detached when evaluating the evidence.','研究人员在评估证据时应保持客观冷静。','de-“离开” + attach“连接” + -ed → 脱离的 → 客观超然的'],['eclipse','n. 日食；月食；v. 使黯然失色；超过','Her latest achievement eclipsed all her previous successes.','她最新的成就使以往所有成功都黯然失色。','ec-/ex-“出/离开” + lip“离开” → 光离去 → 食；引申为使黯然失色'],['evaluate','v. 评估；评价；估计','Students should learn to evaluate information critically.','学生应该学会批判性地评估信息。','e-/ex-“出” + valu“价值” + -ate → 判断价值 → 评估'],['extreme','adj. 极端的；极度的','The region experienced extreme weather last winter.','这个地区去年冬天经历了极端天气。','extr“外/最外” + -eme → 最外端的 → 极端的'],['tribal','adj. 部落的；部族的','Some traditions remain important in tribal communities.','一些传统在部落社区中仍然十分重要。','tribe 部落 + -al 形容词后缀'],['populist','n. 民粹主义者；adj. 民粹主义的','The politician adopted populist language during the campaign.','这名政治人物在竞选期间采用了民粹主义式的言辞。','popul“人民” + -ist“主义者/相关的” → 民粹主义者/民粹主义的']];
const KEY='cet6-v2';let S=JSON.parse(localStorage.getItem(KEY)||'{}');if(!S.known)S.known={};if(!S.review)S.review={};let mode='browse',list=[],i=0,revealed=false;const intervals=[1,2,4,7,15,30,60];function save(){localStorage.setItem(KEY,JSON.stringify(S))}function sh(a){return [...a].sort(()=>Math.random()-.5)}function known(w){return !!S.known[w]}function due(w){let r=S.review[w];return known(w)&&(!r||r.due<=Date.now())}function roots(x){return x[4]?`<div class="root">词根词缀：${x[4]}</div>`:''}function details(x){return `<div class="meaning">${x[1]}</div><div class="example">${x[2]}</div><div class="zh">${x[3]}</div>${roots(x)}`}function setMode(m){mode=m;i=0;revealed=false;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('t'+m).classList.add('active');if(m==='wordbook'){renderWordbook('');return}if(m==='browse')list=V.filter(x=>!known(x[0]));if(m==='challenge')list=sh(V.filter(x=>!known(x[0])));if(m==='review')list=sh(V.filter(x=>due(x[0])));render()}function renderWordbook(q){let a=[...V].sort((a,b)=>a[0].localeCompare(b[0]));q=(q||'').trim().toLowerCase();if(q)a=a.filter(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));document.getElementById('stage').innerHTML=`<input class="search" placeholder="搜索英文单词或中文含义…" value="${q.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" oninput="renderWordbook(this.value)"><div class="bookcount">${a.length} / ${V.length} 个单词 · A–Z</div><div>${a.map(x=>`<div class="bookitem"><div class="bookword">${x[0]}</div><div class="bookmeaning">${x[1]}</div></div>`).join('')}</div>`}function render(){let st=document.getElementById('stage');if(!list.length){let msg=mode==='review'?'今天暂无到期复习任务。':'当前模式没有待学习单词。';st.innerHTML=`<div class="empty">${msg}<br><small>已认识 ${Object.keys(S.known).filter(k=>S.known[k]).length} / ${V.length} 个</small><br><button class="reset" onclick="resetKnown()">重置学习记录</button></div>`;return}i=Math.max(0,Math.min(i,list.length-1));let x=list[i],head=`<div class="meta"><span>${mode==='browse'?'刷词':mode==='challenge'?'挑战':'复习'}</span><span>${i+1} / ${list.length}</span></div>`;if(mode==='browse'){st.innerHTML=head+`<div class="card"><div class="word">${x[0]}</div>${details(x)}</div><div class="actions"><button onclick="move(-1)">← 上一词</button><button class="primary" onclick="move(1)">下一词 →</button></div>`;return}let ans=revealed?details(x):`<div class="hint">${mode==='review'?'先回忆释义，再作答':'你认识这个词吗？'}</div>`;st.innerHTML=head+`<div class="card" onclick="${revealed?'':'showDetails()'}"><div class="word">${x[0]}</div>${ans}</div><div class="actions"><button onclick="judge(false)">不认识</button><button class="primary" onclick="judge(true)">认识 ✓</button></div>`}function move(d){i=(i+d+list.length)%list.length;render()}function showDetails(){revealed=true;render()}function schedule(w,good){let r=S.review[w]||{level:0,due:Date.now()};if(good)r.level=Math.min((r.level||0)+1,intervals.length-1);else r.level=0;r.due=Date.now()+intervals[r.level]*86400000;S.review[w]=r;save()}function judge(good){let x=list[i],w=x[0];if(mode==='challenge'){if(good){S.known[w]=true;S.review[w]={level:0,due:Date.now()+86400000};save();list.splice(i,1);revealed=false;if(i>=list.length)i=0;render()}else{if(!revealed){revealed=true;render()}else{revealed=false;i=(i+1)%list.length;render()}}return}if(mode==='review'){schedule(w,good);revealed=false;list.splice(i,1);if(i>=list.length)i=0;render()}}function resetKnown(){if(confirm('确定清空“认识”与复习进度吗？')){S={known:{},review:{}};save();setMode(mode)}}setMode('browse');
</script></body></html>
