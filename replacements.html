<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>六级常见替换</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 70px}h1{font-size:22px;margin-bottom:6px}.sub{color:#888;font-size:13px;margin-bottom:16px}.back{display:inline-block;background:#fff;color:#222;text-decoration:none;padding:10px 14px;border-radius:12px;margin-bottom:15px}.search{width:100%;padding:14px;border:0;border-radius:14px;font-size:15px;margin-bottom:12px}.item{background:#fff;border-radius:16px;padding:16px;margin:9px 0;box-shadow:0 4px 18px #00000008}.pair{font-size:18px;font-weight:700;line-height:1.5}.arrow{color:#999;margin:0 7px}.meaning{color:#666;margin-top:6px;line-height:1.55}.tag{display:inline-block;font-size:11px;background:#eee;padding:3px 7px;border-radius:99px;margin-top:8px;color:#666}.count{color:#888;font-size:13px;margin:4px 2px 10px}</style></head><body><div class="app"><a class="back" href="index.html">← 返回单词学习</a><h1>六级阅读常见替换</h1><div class="sub">重点记阅读定位中的同义改写，而不是死记单个词义。</div><input id="q" class="search" placeholder="搜索英文或中文…"><div id="count" class="count"></div><div id="list"></div></div><script>const R=[['get rid of','eliminate','摆脱；去除 → 消除；淘汰'],['tired','fatigued / drained','疲惫的 → 疲劳的 / 精力被耗尽的'],['guess','speculate / hypothesise','猜测 → 推测 / 提出假设'],['reduce','diminish','减少 → 减少；削弱'],['predict','foresee','预测 → 预见；预知'],['short and clear','concise','简短清楚的 → 简明的；简洁的']];const list=document.getElementById('list'),count=document.getElementById('count'),q=document.getElementById('q');function render(){let s=q.value.trim().toLowerCase(),a=R.filter(x=>!s||x.join(' ').toLowerCase().includes(s));count.textContent=a.length+' 组常见替换';list.innerHTML=a.map(x=>'<div class="item"><div class="pair">'+x[0]+'<span class="arrow">→</span>'+x[1]+'</div><div class="meaning">'+x[2]+'</div><span class="tag">六级阅读定位</span></div>').join('')}q.oninput=render;render();</script></body></html>
